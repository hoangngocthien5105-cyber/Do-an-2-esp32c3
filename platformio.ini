
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_port = COM9
upload_port = COM9

; Bỏ monitor_rts/dtr = 0 vì USB CDC trên ESP32-C3 cần DTR=1 mới xuất Serial
; monitor_rts = 0
; monitor_dtr = 0

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
